<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="四级词库：按词族和易混组组织的单词复习工具">
<title>四级词库</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=19">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/review" aria-label="回到复习">
    <span class="logo" aria-hidden="true">四</span>
    <span class="brand-text">
      <strong>四级词库</strong>
      <small id="subtitle">正在加载…</small>
    </span>
  </a>
  <div class="top-actions">
    <div class="top-search" id="top-search">
      <span class="ico" data-icon="search"></span>
      <input id="search" type="text" enterkeyhint="search" placeholder="搜单词、中文、音标…" autocomplete="off" spellcheck="false">
      <button class="icon-btn" id="clear-search" type="button" aria-label="清空搜索">
        <span class="ico" data-icon="close"></span>
      </button>
    </div>
    <button class="due-pill" id="due-pill" type="button" title="距离 2026-12-12 四级考试">
      <span>距离考试</span><b id="exam-days">--</b><span>天</span>
    </button>
  </div>
</header>

<nav class="tabs" aria-label="主导航">
  <a href="#/review" data-tab="review">复习</a>
  <a href="#/relations" data-tab="relations">关系</a>
  <a href="#/words" data-tab="words">词库</a>
  <a href="#/data" data-tab="data">数据</a>
</nav>

<main id="app" tabindex="-1">
  <div class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>正在读取词库…</p>
  </div>
</main>

<nav class="tabbar" aria-label="底部导航">
  <a href="#/review" data-tab="review"><span class="ico" data-icon="cards"></span><span>复习</span></a>
  <a href="#/relations" data-tab="relations"><span class="ico" data-icon="link"></span><span>关系</span></a>
  <a href="#/words" data-tab="words"><span class="ico" data-icon="book"></span><span>词库</span></a>
  <a href="#/data" data-tab="data"><span class="ico" data-icon="chart"></span><span>数据</span></a>
</nav>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" id="modal-close" type="button" aria-label="关闭">
        <span class="ico" data-icon="close"></span>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=19" defer></script>
</body>
</html>
